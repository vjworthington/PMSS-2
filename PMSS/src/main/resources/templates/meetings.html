<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Meetings</title>
</head>

<body>
<div th:replace="~{fragments/banner :: banner}"></div>
<div style="max-width:1000px; width:90%; margin:auto;">
    <h1>Meetings</h1>
    <hr>

    <p th:if="${successMessage}" th:text="${successMessage}" style="color:#15803d;"></p>

    <a th:href="@{/meetings/create}">
        <button style="width:180px;height:40px;">Create Meeting</button>
    </a>
    <br><br>

    <div th:if="${#lists.isEmpty(meetings)}">
        <p>No meetings to display.</p>
    </div>

    <table border="1" cellpadding="8" cellspacing="0" width="100%"
           th:if="${!#lists.isEmpty(meetings)}">
        <tr>
            <th>ID</th>
            <th>Meeting</th>
            <th>Date</th>
            <th>Start</th>
            <th>End</th>
            <th>Room</th>
            <th>Status</th>
        </tr>
        <tr th:each="meeting : ${meetings}">
            <td th:text="${meeting.meetingID}"></td>
            <td th:text="${meeting.meetingName}"></td>
            <td th:text="${meeting.meetingDate}"></td>
            <td th:text="${meeting.startTime}"></td>
            <td th:text="${meeting.endTime}"></td>
            <td th:text="${meeting.roomNumber}"></td>
            <td th:text="${meeting.status}"></td>
        </tr>
    </table>
</div>
</body>
</html>
