<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>PMSS Landing Page</title>
</head>

<body>
<div th:replace="~{fragments/banner :: banner}"></div>
<div style="width:900px;
            margin:auto;">
    <h1>Welcome to PMSS</h1>
    <p>
        PennStateSoft Meeting Scheduling System
    </p>
    <hr>

    <h1>
        Welcome back,
        <span th:text="${user.firstName}"></span>!
    </h1>

    <!-- ADMIN -->
    <div th:if="${user.role == 'ADMINISTRATOR'}">
        <h2>Administrator Dashboard</h2>
        <br>

        <a href="/rooms">
            <button style="width:220px;height:45px;">
                Manage Rooms
            </button>
        </a>
        <br><br>

        <a href="/complaints/list">
            <button style="width:220px;height:45px;">
                Complaint List
            </button>
        </a>
        <br><br>

        <a href="/admin/register">
            <button style="width:220px;height:45px;">
                Register Administrator
            </button>
        </a>
    </div>

</div>
</body>

</html>
