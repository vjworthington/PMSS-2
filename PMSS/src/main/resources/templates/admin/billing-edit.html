<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Update Client Billing</title>
</head>

<body>
<div th:replace="~{fragments/banner :: banner}"></div>
<div style="max-width:500px; width:90%; margin:auto;">
    <h1>Update Billing &mdash;
        <span th:text="${target.firstName + ' ' + target.lastName}"></span>
    </h1>
    <hr>

    <p th:if="${errorMessage}" th:text="${errorMessage}" style="color:#b91c1c;"></p>

    <p th:if="${card != null}">
        Current card:
        <strong><span th:text="${card.cardType}"></span> ****<span th:text="${card.cardLast4}"></span></strong>,
        exp <span th:text="${card.cardExpiry}"></span>
        (<span th:text="${card.cardholderName}"></span>)
    </p>
    <p th:if="${card == null}">No card on file.</p>

    <hr>
    <form th:action="@{/admin/billing/{id}/edit(id=${target.userID})}" method="post">
        <p>
            <label>Cardholder Name<br>
                <input type="text" name="cardholderName" th:value="${card != null ? card.cardholderName : ''}"
                       style="width:250px;padding:8px;">
            </label>
        </p>
        <p>
            <label>Card Type<br>
                <select name="cardType" style="width:160px;padding:8px;">
                    <option value="Visa">Visa</option>
                    <option value="Mastercard">Mastercard</option>
                    <option value="Amex">Amex</option>
                    <option value="Discover">Discover</option>
                </select>
            </label>
        </p>
        <p>
            <label>Card Number<br>
                <input type="text" name="cardNumber" placeholder="1234 5678 9012 3456"
                       style="width:250px;padding:8px;">
            </label>
        </p>
        <p>
            <label>Expiration (MM/YY)<br>
                <input type="text" name="cardExpiry" th:value="${card != null ? card.cardExpiry : ''}"
                       placeholder="MM/YY" style="width:120px;padding:8px;">
            </label>
        </p>

        <button type="submit" style="width:150px;height:40px;">Save</button>
        <a th:href="@{/admin/billing}">
            <button type="button" style="width:100px;height:40px;">Cancel</button>
        </a>
    </form>
</div>
</body>
</html>
