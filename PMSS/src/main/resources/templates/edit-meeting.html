<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Meeting</title>
</head>

<body>
<div th:replace="~{fragments/banner :: banner}"></div>
<div style="max-width:600px; width:90%; margin:auto;">
    <h1>Edit Meeting</h1>
    <hr>

    <p th:if="${errorMessage}" th:text="${errorMessage}" style="color:#b91c1c;"></p>
    <p th:if="${successMessage}" th:text="${successMessage}" style="color:#15803d;"></p>

    <form th:action="@{/meetings/{id}/edit(id=${meetingId})}" method="post">
        <p>
            <label>Meeting Name<br>
                <input type="text" name="meetingName" th:value="${meetingName}"
                       style="width:250px;padding:8px;">
            </label>
        </p>
        <p>
            <label>Date<br>
                <input type="date" name="meetingDate" th:value="${meetingDate}"
                       style="width:250px;padding:8px;">
            </label>
        </p>
        <p>
            <label>Start Time<br>
                <select name="startTime" style="width:130px;padding:8px;">
                    <option value="">--</option>
                    <option th:each="slot : ${timeSlots}"
                            th:value="${slot}" th:text="${slot}"
                            th:selected="${startTime == slot}"></option>
                </select>
            </label>
        </p>
        <p>
            <label>End Time<br>
                <select name="endTime" style="width:130px;padding:8px;">
                    <option value="">--</option>
                    <option th:each="slot : ${timeSlots}"
                            th:value="${slot}" th:text="${slot}"
                            th:selected="${endTime == slot}"></option>
                </select>
            </label>
        </p>
        <p>
            <label>Room<br>
                <select name="roomNumber" style="width:250px;padding:8px;">
                    <option value="">-- Select room --</option>
                    <option th:each="room : ${rooms}"
                            th:value="${room.roomNumber}"
                            th:selected="${roomNumber != null and roomNumber == room.roomNumber}"
                            th:text="${'Room ' + room.roomNumber + ' (' + room.roomType + ')'}"></option>
                </select>
            </label>
        </p>

        <br>
        <button type="submit" style="width:150px;height:40px;">Save Changes</button>
        <a th:href="@{/schedule}">
            <button type="button" style="width:100px;height:40px;">Cancel</button>
        </a>
    </form>

    <hr>
    <h3>Participants</h3>

    <div th:if="${#lists.isEmpty(attendees)}">
        <p>No participants yet.</p>
    </div>
    <ul th:if="${!#lists.isEmpty(attendees)}">
        <li th:each="att : ${attendees}">
            <span th:text="${att.firstName + ' ' + att.lastName}"></span>
            <form th:action="@{/meetings/{id}/attendees/remove(id=${meetingId})}" method="post"
                  style="display:inline;">
                <input type="hidden" name="userID" th:value="${att.userID}">
                <button type="submit">Remove</button>
            </form>
        </li>
    </ul>

    <form th:action="@{/meetings/{id}/attendees/add(id=${meetingId})}" method="post">
        <label>Add participant:
            <select name="userID" style="width:220px;">
                <option value="">-- Select person --</option>
                <option th:each="person : ${addableClients}"
                        th:value="${person.userID}"
                        th:text="${person.firstName + ' ' + person.lastName}"></option>
            </select>
        </label>
        <button type="submit">Add</button>
    </form>

    <hr>
    <form th:action="@{/meetings/{id}/delete(id=${meetingId})}" method="post"
          onsubmit="return confirm('Delete this meeting?');">
        <button type="submit" style="color:#b91c1c;">Delete Meeting</button>
    </form>
</div>
</body>
</html>
