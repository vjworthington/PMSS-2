<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Something went wrong</title>
</head>

<body>
<div style="max-width:560px; margin:80px auto; text-align:center;">
    <img th:src="@{/images/PMSS.jpg}" alt="PMSS Logo" width="180">

    <h1>Something went wrong</h1>

    <p style="color:#6b7280;">
        <span th:if="${status}">Error <span th:text="${status}"></span></span>
        <span th:if="${error}" th:text="' — ' + ${error}"></span>
    </p>

    <p style="color:#374151;"
       th:text="${message} ?: 'An unexpected error occurred. Please try again.'"></p>

    <p style="margin-top:24px;">
        <a th:href="@{/}">Return to PMSS</a>
    </p>
</div>
</body>
</html>
