<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>PMSS Login</title>
</head>

<body>
<div style="width:400px;
            margin:80px auto;
            text-align:center;">
    <img th:src="@{/images/PMSS.jpg}"
         alt="PMSS Logo"
         width="220">
    <br>

    <form th:action="@{/login}" method="post">
        <p>
            <input
                    type="email"
                    name="email"
                    placeholder="Email"
                    required
                    style="width:250px;padding:8px;">
        </p>

        <p>
            <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required
                    autocomplete="current-password"
                    style="width:250px;padding:8px;">
        </p>

        <br>
        <button type="submit"
                style="width:140px;height:35px;">
            Login
        </button>
    </form>

    <p th:if="${param.error}" style="color:red;">
        Invalid email or password
    </p>

    <p th:if="${param.locked}" style="color:red;">
        Email locked for 15 minutes
    </p>

    <p style="margin-top:20px;">
        Don't have an account?
        <a th:href="@{/register}">Create one</a>
    </p>
</div>

</body>
</html>
