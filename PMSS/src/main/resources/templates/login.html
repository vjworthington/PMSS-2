<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>PMSS Login</title>
</head>

<body>
<div style="width:400px;
            margin:80px auto;
            text-align:center;">
    <img th:src="@{/images/PMSS.jpg}"
         alt="PMSS Logo"
         width="220">
    <br>

    <form th:action="@{/login}" method="post">
        <p>
            <input
                    type="email"
                    name="email"
                    placeholder="Email"
                    required
                    style="width:250px;padding:8px;">
        </p>

        <p>
            <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required
                    style="width:250px;padding:8px;">
        </p>

        <br>
        <button type="submit"
                style="width:140px;height:35px;">
            Login
        </button>
    </form>
</div>

</body>
</html>
