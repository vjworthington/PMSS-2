# Integration-test profile.
#
# Runs the full Spring context against an isolated, in-memory SQLite database so
# integration tests never read or mutate the real database/PMSS.db file.
#
# A shared-cache in-memory DB (mode=memory&cache=shared) lets the schema
# initializer and the application share one logical database, and pinning the
# Hikari pool to a single connection keeps that in-memory DB alive for the whole
# context lifetime (and sidesteps SQLite's single-writer locking).

spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.url=jdbc:sqlite:file:pmss_it_db?mode=memory&cache=shared
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1

# Create the schema from a test-only DDL file (never the app's real DB).
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-test.sql
spring.sql.init.data-locations=

spring.thymeleaf.cache=false
